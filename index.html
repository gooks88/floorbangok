<!doctype html>
<html lang="ko" style="--toolsH: 82px;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>반곡고등학교 층별 배치도</title>
<!--
  층별 아이소(등각) 배치도. 방 모양·문·기둥은 아래 plan-data(마을 지도 school-plan.js에서 만든 실측 m)에서 그리고,
  방 이름·분류는 labels에서 읽는다. 해마다 교실이 바뀌면 화면 위 [라벨 편집]으로 고친 뒤 [HTML 저장]으로 새 파일을 받는다.
  만든 곳: school_village 저장소 tools/isoplan (node tools/isoplan/build.mjs)
-->
<style id="pagesize">@page { size: A3 landscape; margin: 0 }</style>
<style>
:root { --ink: #23262a; --muted: #6f747b; --rule: #2a2d31; }
* { box-sizing: border-box }
html, body { margin: 0; background: #e6e3dd; color: var(--ink);
  font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  -webkit-print-color-adjust: exact; print-color-adjust: exact; }

/* 화면 도구 줄(인쇄에는 안 나옴) */
.tools { position: fixed; top: 0; left: 0; right: 0; z-index: 9; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  padding: 8px 14px; background: #2b2f34; color: #eee; font-size: 13px; }
.tools b { font-size: 14px; margin-right: 6px; color: #fff }
.tools button, .tools select { font: inherit; padding: 5px 11px; border-radius: 6px; border: 1px solid #4b5158;
  background: #3b4047; color: #fff; cursor: pointer; }
.tools button:hover { background: #4a5058 }
.tools button.on { background: #f0b443; border-color: #f0b443; color: #222 }
.tools .sp { flex: 1 }
.tools .seg { display: inline-flex; margin-right: 6px } .tools .seg button { border-radius: 0; margin-left: -1px }
.tools .seg button:first-child { border-radius: 6px 0 0 6px } .tools .seg button:last-child { border-radius: 0 6px 6px 0 }
.tools .setpick { margin-left: 8px } .tools .setpick select { max-width: 180px }
.tools .find { display: inline-flex; margin-left: 8px } .tools .find input { font: inherit; width: 190px; padding: 5px 9px; border-radius: 6px 0 0 6px; border: 1px solid #4b5158; background: #fff; color: #222 }
.tools .find input:only-child, .tools .find input:has(+ [hidden]) { border-radius: 6px }
.tools .find button { border-radius: 0 6px 6px 0; margin-left: -1px }
svg .hl { animation: hl 1.4s ease-in-out infinite }
body.picking .fl-svg svg { cursor: crosshair } body.picking .fl { outline: 2px dashed #e03a2a; outline-offset: -2px }
@keyframes hl { 50% { opacity: .45 } }
.tools .dbnote { color: #b9c2cb; font-size: 12px; margin-right: 8px }
.tools .dirty { color: #f0b443; display: none }
body.changed .tools .dirty { display: inline }

.wrap { display: flex; gap: 14px; padding: 14px 64px 14px 14px; align-items: flex-start }
.wrap > .sheet { margin: 0 auto }   /* 확대해 넘쳐도 왼쪽이 잘리지 않게(가운데 맞춤은 margin으로) */
/* 확대·축소 슬라이더(화면 오른쪽, 인쇄에는 안 나옴) */
.zoom { position: fixed; right: 12px; top: 50%; transform: translateY(-50%); z-index: 8; display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 10px 6px; background: #2b2f34; border-radius: 22px; box-shadow: 0 4px 14px rgba(0,0,0,.25) }
.zoom button { width: 30px; height: 30px; border-radius: 50%; border: 0; background: #41464d; color: #fff; font-size: 17px; cursor: pointer; line-height: 1 }
.zoom button:hover { background: #555b63 }
.zoom input { writing-mode: vertical-lr; direction: rtl; width: 22px; height: 220px; accent-color: #f0b443; cursor: pointer }
.zoom .zval { width: auto; height: auto; padding: 3px 4px; border-radius: 6px; font-size: 11px; background: none; color: #ddd }

/* 종이 한 장 */
.sheet { flex: none; width: 420mm; height: 297mm; background: #fff; box-shadow: 0 3px 14px rgba(0,0,0,.2);
  padding: 9mm 10mm 7mm; display: grid; grid-template-rows: auto 1fr auto; gap: 3mm; overflow: hidden; }
.sheet.a4 { width: 297mm; height: 210mm; padding: 6.4mm 7mm 5mm; gap: 2.1mm }
/* 두 층씩(세로 종이): 위층이 위에 */
.sheet.tall { width: 297mm; height: 420mm } .sheet.tall.a4 { width: 210mm; height: 297mm }
.floors.two { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr auto }
.floors.two .key { position: static; justify-self: end; order: 5 }   /* 두 층씩은 범례를 그림 아래 한 줄로(아래층 그림을 가리지 않게) */ .floors.two .fl:not(.show) { display: none }
.floors.two .fl[data-floor="2F"], .floors.two .fl[data-floor="4F"] { order: -1 }

.hd { display: flex; align-items: flex-end; gap: 8mm; border-bottom: 0.6mm solid var(--rule); padding-bottom: 2.4mm }
.hd .ttl { flex: none }
.hd .sp { flex: 1 }
.hd .when { font-size: 4.6mm; font-weight: 700; color: #3b3f45; padding-bottom: .8mm }
.sheet.a4 .hd .when { font-size: 3.4mm }
.hd .t0 { font-size: 3.2mm; letter-spacing: .5mm; color: var(--muted); font-weight: 700 }
.hd .t1 { font-size: 8.6mm; font-weight: 800; letter-spacing: -.2mm; line-height: 1.1 }
.sheet.a4 .hd .t1 { font-size: 6.2mm } .sheet.a4 .hd .t0 { font-size: 2.4mm }
/* 범례·방위: 4층 칸의 빈 아래쪽 */
.key { position: absolute; right: 4mm; bottom: 4mm; z-index: 1; display: grid; grid-template-columns: auto 32mm; grid-template-rows: auto 1fr;
  column-gap: 5mm; row-gap: 1.6mm; padding: 3mm 4mm; border: .3mm solid #cfcac0; border-radius: 1.2mm; background: #fff }
.key-t { grid-column: 1; font-size: 3mm; font-weight: 800; letter-spacing: .4mm }
.legend { grid-column: 1; display: grid; grid-template-columns: repeat(4, auto); gap: 1.5mm 4.5mm; font-size: 2.9mm }
.legend span { display: inline-flex; align-items: center; gap: 1.4mm; white-space: nowrap }
.legend i { width: 5mm; height: 3.4mm; border: .25mm solid rgba(0,0,0,.3); border-radius: .6mm; display: inline-block; flex: none }
.key svg { grid-column: 2; grid-row: 1 / 3; width: 32mm; height: 21mm; align-self: center }
.sheet.a4 .key { right: 2.8mm; bottom: 2.8mm; padding: 2mm 3mm; grid-template-columns: auto 23mm; column-gap: 3.5mm; row-gap: 1.1mm }
.sheet.a4 .key-t { font-size: 2.2mm } .sheet.a4 .legend { font-size: 2.05mm; gap: 1.05mm 3.2mm }
.sheet.a4 .legend i { width: 3.6mm; height: 2.4mm } .sheet.a4 .key svg { width: 23mm; height: 15mm }

.floors { position: relative; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2.5mm 5mm; min-height: 0 }
.floors.one { grid-template-columns: 1fr; grid-template-rows: 1fr } .floors.one .fl:not(.show) { display: none }
.floors.one .fl-hd .badge { width: 15mm; height: 15mm; font-size: 7mm } .floors.one .fl-hd .sub { font-size: 3.8mm }
.sheet.a4 .floors.one .fl-hd .badge { width: 11mm; height: 11mm; font-size: 5mm } .sheet.a4 .floors.one .fl-hd .sub { font-size: 2.8mm }
.fl { position: relative; min-height: 0; border: .3mm solid #d9d5cc; border-radius: 1.5mm; overflow: hidden }
.fl-hd { position: absolute; left: 3mm; top: 2.4mm; display: flex; align-items: center; gap: 2.4mm; z-index: 1; max-width: 48% }
.fl-hd .badge { flex: none; display: grid; place-items: center; width: 11mm; height: 11mm; border-radius: 50%;
  background: var(--rule); color: #fff; font-size: 5mm; font-weight: 800; letter-spacing: -.3mm }
.fl-hd .sub { font-size: 3mm; line-height: 1.35; color: #3b3f45; font-weight: 600 }
.sheet.a4 .fl-hd .badge { width: 8mm; height: 8mm; font-size: 3.6mm } .sheet.a4 .fl-hd .sub { font-size: 2.2mm }
.fl-svg, .fl-svg svg { position: absolute; inset: 0; width: 100%; height: 100% }

.ft { display: flex; align-items: center; gap: 6mm; font-size: 2.6mm; color: var(--muted); border-top: .3mm solid #cfcac0; padding-top: 1.6mm }
.ft .sp { flex: 1 }
.sheet.a4 .ft { font-size: 2mm }

/* 도면 글자 */
svg text { font-family: inherit; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke-linejoin: round; }
svg text.nm, svg text.no { stroke: #fff }
svg .nm { font-weight: 700; fill: #1f2226 }
svg .no { fill: #6b6f76; font-weight: 600 }

/* 라벨 편집 */
body.editing [data-meta], body.editing [data-sub] { outline: 1px dashed #e0a12e; outline-offset: 2px; cursor: text }
body.editing .room { cursor: pointer }
body.editing .room:hover { filter: brightness(.93) }
.room.hit { animation: hit 1s ease 2 }
@keyframes hit { 50% { filter: brightness(.75) } }
.panel { flex: none; width: 380px; max-height: calc(100vh - var(--toolsH, 60px) - 20px); overflow: auto; position: sticky; top: calc(var(--toolsH, 60px) + 10px);
  background: #fff; border-radius: 8px; box-shadow: 0 3px 14px rgba(0,0,0,.18); padding: 12px 14px; font-size: 13px }
.panel h3 { margin: 2px 0 6px; font-size: 15px }
.panel .hint { margin: 0 0 10px; color: #666; line-height: 1.5 }
.panel details { margin-bottom: 8px }
.panel summary { font-weight: 700; cursor: pointer; padding: 4px 0 }
.panel table { width: 100%; border-collapse: collapse }
.panel td { padding: 2px 2px; border-bottom: 1px solid #f0eee9 }
.panel td.no { color: #888; width: 52px; font-size: 12px }
.panel input[type=text] { width: 100%; font: inherit; padding: 3px 5px; border: 1px solid #ccc; border-radius: 4px }
.panel select { font: inherit; font-size: 12px; padding: 2px; max-width: 98px }
.panel tr.hid input[type=text] { color: #aaa; text-decoration: line-through }
.panel tr.flash td { background: #fff3cf }
.panel .gen { color: #999; font-size: 11px }
.panel tr.own input[type=text] { border-color: #e0a12e; background: #fffaf0; font-weight: 700 }
.panel .undo { border: 0; background: none; cursor: pointer; color: #b07a17; font-size: 14px; padding: 0 2px; visibility: hidden }
.panel tr.own .undo { visibility: visible }
.panel .setinfo { margin: -4px 0 10px; padding: 6px 8px; background: #fff6e0; border-radius: 6px; line-height: 1.5 }

.toast { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); z-index: 20; max-width: 560px; padding: 12px 18px;
  background: #2b2f34; color: #fff; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.3); font-size: 14px; line-height: 1.6 }
.toast b { color: #f0b443 }
body { padding-top: var(--toolsH, 50px) }   /* 고정한 도구 줄 높이만큼(창 너비에 따라 줄 수가 바뀌어 스크립트가 잰다) */
@media print {
  body { padding-top: 0 !important }
  .toast { display: none !important }
  html, body { background: #fff }
  .tools, .panel, .zoom { display: none !important }
  .wrap { padding: 0; display: block }
  .sheet { box-shadow: none; zoom: 1 !important; margin: 0 }
}
</style>
</head>

const C = Math.cos(Math.PI / 6), S = 0.5;
/* 보는 방향(2026-10-20 사용자): 평면을 원점 둘레로 ROT만큼 돌린 뒤 등각으로 그린다. 그림 위쪽 = 바라보는 쪽.

let RC = 1, RS = 0, VX = Math.SQRT1_2, VY = Math.SQRT1_2;   // 회전 cos·sin, 보는 사람 쪽(평면, 단위벡터)

/* 회전(2026-10-20 사용자): 기본은 아이소, ⟲⟳ 단추로 90도씩(LB.meta.turn). 현재 위치를 찍으면 바라보는 쪽이 위로 오게 놓고 그 위에서 다시 90도씩 */

  });

  return { f, rooms, xs, ys, nx, ny, at, cellAt, kind };
}

/* 두 칸 사이에 무엇이 서나: null(트임) · wall · ext(바깥벽) · rail(난간) */
function edgeKind(A, a, b) {
  if (a === b) return null;
  if (a >= 0 && b >= 0 && A.rooms[a][0] === A.rooms[b][0]) return null;
  const ta = A.kind(a), tb = A.kind(b);
  const outish = (t) => t === 'out' || t === 'court';
  if (outish(ta) && outish(tb)) return null;
  if (outish(ta) || outish(tb)) return (outish(ta) ? tb : ta) === 'void' ? 'rail' : 'ext';
  if (ta === 'void' && tb === 'void') return null;
  const oa = OPEN.has(ta), ob = OPEN.has(tb);
  if (oa && ob) return null;
  if ((ta === 'void' && (ob || tb === 'stair')) || (tb === 'void' && (oa || ta === 'stair'))) return 'rail';
  if ((ta === 'stair' && ob) || (tb === 'stair' && oa)) return null;   // 중앙계단은 홀에 열려 있다(난간은 뚫린 곳 둘레에만)
  if ((ta === 'gym' && tb === 'stage') || (ta === 'stage' && tb === 'gym')) return null;
  return 'wall';
}

/* 같은 줄에서 이어지고 종류·양쪽 방이 같은 변을 묶어 벽 줄로 */
function edgeRuns(A, kindFn) {
  const { xs, ys, nx, ny, at } = A, out = [];
  for (let j = 0; j <= ny; j++) {
    let cur = null;
    for (let i = 0; i < nx; i++) {
      const a = at(i, j - 1), b = at(i, j), k = kindFn(a, b);
      if (cur && k === cur.kind && cur.na === a && cur.nb === b) { cur.b = xs[i + 1]; continue; }
      cur = k ? { ax: 'h', at: ys[j], a: xs[i], b: xs[i + 1], kind: k, na: a, nb: b } : null;
      if (cur) out.push(cur);
    }
  }
  for (let i = 0; i <= nx; i++) {
    let cur = null;
    for (let j = 0; j < ny; j++) {
      const a = at(i - 1, j), b = at(i, j), k = kindFn(a, b);
      if (cur && k === cur.kind && cur.na === a && cur.nb === b) { cur.b = ys[j + 1]; continue; }
      cur = k ? { ax: 'v', at: xs[i], a: ys[j], b: ys[j + 1], kind: k, na: a, nb: b } : null;
      if (cur) out.push(cur);
    }
  }
  return out;
}

/* 문: 도면 문 목록 + 지도에 입구(entry)를 정한 계단실의 입구 */
function doorsOf(A, runs) {
  const list = PLAN.floors[A.f].doors.map(([ax, at, a, b, open, hinge]) => ({ ax, at, a: Math.min(a, b), b: Math.max(a, b), open, hinge }));
  const onRun = (d, r) => r.ax === d.ax && Math.abs(r.at - d.at) < 0.2 && d.a < r.b - 0.05 && d.b > r.a + 0.05 && r.kind !== 'rail';
  const has = new Set();
  for (const d of list) for (const r of runs) if (onRun(d, r)) { d.hit = true; if (r.na >= 0) has.add(A.rooms[r.na][0]); if (r.nb >= 0) has.add(A.rooms[r.nb][0]); }
  // 문은 도면 문 목록에 있는 것만 그린다. 목록에 없는 방에 문을 지어내지 않는다(2026-10-20 사용자)
  // 도면에 입구를 정한 계단실: 그 변 가운데가 막혀 있으면 문을 하나 낸다(1.2m)
  A.rooms.forEach((r, k) => {
    const e = r[7].entry; if (!e || A.kind(k) !== 'stairroom') return;
    const h = e === 'N' || e === 'S', at = { N: r[5], S: r[6], W: r[3], E: r[4] }[e], mid = h ? (r[3] + r[4]) / 2 : (r[5] + r[6]) / 2;
    if (list.some((d) => d.hit && d.ax === (h ? 'h' : 'v') && Math.abs(d.at - at) < 0.2 && d.a < mid + 0.6 && d.b > mid - 0.6)) return;
    list.push({ ax: h ? 'h' : 'v', at, a: mid - 0.6, b: mid + 0.6, open: e === 'N' || e === 'W' ? (h ? 'S' : 'E') : (h ? 'N' : 'W'), hinge: 'a', hit: true });
  });
  return list.filter((d) => d.hit);
}

/* 벽 줄에서 문 자리를 뺀 조각들 */
function cutDoors(r, doors) {
  let parts = [[r.a, r.b]];
  for (const d of doors) {
    if (d.ax !== r.ax || Math.abs(d.at - r.at) > 0.2) continue;
    parts = parts.flatMap(([p, q]) => (d.b <= p || d.a >= q ? [[p, q]] : [[p, d.a], [d.b, q]].filter(([u, v]) => v - u > 0.05)));
  }
  return parts;
}

const el = (tag, attrs, inner = '') => `<${tag} ${Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(' ')}>${inner}</${tag}>`;

const quadFloor = (x0, x1, y0, y1, z = 0) => [pt(x0, y0, z), pt(x1, y0, z), pt(x1, y1, z), pt(x0, y1, z)];

const faceSeen = (nx, ny) => nx * VX + ny * VY > 0.02;   // 바깥 방향이 (nx,ny)인 면이 보이나
function boxFaces(x0, x1, y0, y1, z0, z1, cs, ce, ct) {
  const f = (a, b, col) => poly([pt(...a, z0), pt(...b, z0), pt(...b, z1), pt(...a, z1)], col);
  let sides = '';
  if (faceSeen(0, 1)) sides += f([x0, y1], [x1, y1], cs);
  if (faceSeen(0, -1)) sides += f([x0, y0], [x1, y0], cs);
  if (faceSeen(1, 0)) sides += f([x1, y0], [x1, y1], ce);

  document.getElementById('bPaper').value = LB.meta.paper;
  document.getElementById('bHereX').hidden = !LB.meta.here;
  document.querySelectorAll('#bView button').forEach((b) => b.classList.toggle('on', b.dataset.v === LB.meta.view));
  const sel = document.getElementById('bSet');
  sel.innerHTML = [['', '기본(공간 DB)'], ...LB.sets.map((x) => [x.name, x.name])].map(([v, n]) => `<option value="${esc(v)}">${esc(n)}</option>`).join('');
  sel.value = LB.active;
  document.getElementById('bSetMenu').disabled = !LB.active;
}
document.getElementById('bEdit').onclick = () => setEditing(!document.body.classList.contains('editing'));
document.getElementById('bNum').onclick = () => { LB.meta.showNum = !LB.meta.showNum; markChanged(); renderAll(); };
document.getElementById('bCtx').onclick = () => { LB.meta.context = !LB.meta.context; markChanged(); renderAll(); };
document.getElementById('bStair').onclick = () => { LB.meta.stairCheck = !LB.meta.stairCheck; markChanged(); renderAll(); };
document.getElementById('bFurn').onclick = () => { LB.meta.furniture = !LB.meta.furniture; markChanged(); renderAll(); };
document.getElementById('bPaper').onchange = (e) => { LB.meta.paper = e.target.value; markChanged(); renderAll(); };
document.getElementById('bView').onclick = (e) => { const v = e.target.dataset?.v; if (v && v !== LB.meta.view) { LB.meta.view = v; renderAll(); } };
/* 라벨 세트 고르기·만들기·이름 바꾸기·지우기 */
const switchSet = (name) => { LB.active = name; renderAll(); if (document.body.classList.contains('editing')) buildPanel(); };
document.getElementById('bSet').onchange = (e) => switchSet(e.target.value);
document.getElementById('bSetNew').onclick = () => {
  const name = (prompt('새 라벨 세트 이름 (예: 수능 시험장, 캠공 강의실)\n지금 보이는 라벨에서 시작하고, 이 세트에서 고친 방만 따로 저장됩니다.') || '').trim();
  if (!name) return;
  if (LB.sets.some((x) => x.name === name)) return alert('같은 이름의 세트가 이미 있어요.');
  const cur = activeSet();
  LB.sets.push({ name, rooms: JSON.parse(JSON.stringify(cur?.rooms || {})), meta: JSON.parse(JSON.stringify(cur?.meta || {})) });
  markChanged(); switchSet(name);
  if (!document.body.classList.contains('editing')) setEditing(true);
};
document.getElementById('bSetMenu').onclick = () => {
  const cur = activeSet(); if (!cur) return;
  const v = prompt(`'${cur.name}' 세트\n새 이름을 적으면 이름이 바뀌고, 「지우기」라고 적으면 세트를 지웁니다.`, cur.name);
  if (v === null) return;
  if (v.trim() === '지우기') { if (confirm(`'${cur.name}' 세트를 지울까요?`)) { LB.sets = LB.sets.filter((x) => x !== cur); markChanged(); switchSet(''); } return; }
  const name = v.trim(); if (!name || name === cur.name) return;
  if (LB.sets.some((x) => x.name === name)) return alert('같은 이름의 세트가 이미 있어요.');
  cur.name = name; LB.active = name; markChanged(); renderAll();
};
document.getElementById('bPrint').onclick = () => window.print();
/* PDF 저장: 브라우저 인쇄 창의 'PDF로 저장'을 쓴다(벡터라 확대해도 선명, 글자 선택·주석 가능). 파일 이름은 문서 제목을 따른다 */
document.getElementById('bPdf').onclick = () => {
  const clean = (x) => (x || '').replace(/[\/:*?"<>|]/g, '').trim();
  const name = `${clean(metaVal('title')) || '배치도'} (${clean(metaVal('date'))})${LB.meta.view === '12' ? ' 1·2F' : LB.meta.view === '34' ? ' 3·4F' : LB.meta.view !== 'all' ? ' ' + LB.meta.view : ''}${LB.active ? ' - ' + clean(LB.active) : ''}`;
  const t = document.getElementById('toast'), old = document.title;
  t.innerHTML = `인쇄 창에서 <b>대상(프린터)</b>을 <b>「PDF로 저장」</b>(또는 Microsoft Print to PDF)으로 고르고 <b>저장</b>을 누르세요.<br>용지: ${LB.meta.paper} ${LB.meta.view === "12" || LB.meta.view === "34" ? "세로" : "가로"} · 파일 이름: ${esc(name)}.pdf`;
  t.hidden = false;
  document.title = name;
  const done = () => { document.title = old; window.removeEventListener('afterprint', done); setTimeout(() => { t.hidden = true; }, 2500); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 400);
};
document.getElementById('bSave').onclick = () => {
  const doc = document.documentElement.cloneNode(true);
  doc.querySelectorAll('.fl-svg, #legend, #north, #panel').forEach((e) => { e.innerHTML = ''; });
  doc.querySelector('#panel').hidden = true;
  doc.querySelector('#sheet').removeAttribute('style');
  doc.querySelectorAll('[contenteditable]').forEach((e) => e.removeAttribute('contenteditable'));
  doc.querySelector('body').className = '';
  doc.querySelector('#labels').textContent = JSON.stringify(LB, null, 1).replace(/</g, '\\u003c');
  const html = '<!doctype html>\n' + doc.outerHTML;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  const clean = (x) => (x || '').replace(/[\\/:*?"<>|]/g, '');
  a.download = `${clean(metaVal('title')) || '배치도'} (${clean(metaVal('date'))}).html`;
  document.body.appendChild(a); a.click(); a.remove();
  document.body.classList.remove('changed');
};
window.addEventListener('beforeunload', (e) => { if (document.body.classList.contains('changed')) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('resize', fitScreen);
window.addEventListener('beforeprint', () => { document.getElementById('sheet').style.zoom = ''; });
window.addEventListener('afterprint', fitScreen);

applyDb();
setFacing();
renderAll();
buildFind();
loadDb().then(buildFind);
loadWork();
})();
</script>


</body></html>
